mybatis-plus:
  type-aliases-package: com.yixuan.yh.video.pojo
  mapper-locations: "classpath*:/com/yixuan/yh/**/mapper/*.xml"
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id # id 为雪花算法生成
      update-strategy: not_null

aws:
  url: http://minio:9000
  secret-key: ${MINIO_SECRET_KEY}
  access-key: ${MINIO_ACCESS_KEY}
  bucket: video

xxl:
  job:
    admin:
      addresses: http://xxljob:12001/xxl-job-admin
    executor:
      appname: video
    access-token: ${XXL_JOB_ACCESS_TOKEN}

milvus:
  uri: http://milvus:19530


redisson:
  address: redis://redis:6379
  password: ${REDIS_PASSWORD}
  connectionPoolSize: 6
  connectionMinimumIdleSize: 2
  pingConnectionInterval: 30000
  timeout: 5000
  idleConnectionTimeout: 60000

dynamic:
  enabled: true
  threadpools:
    videoExecutor:
      core-pool-size: 2
      maximumPoolSize: 5