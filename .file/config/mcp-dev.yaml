spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 768
    alibaba:
      mcp:
        nacos:
          server-addr: nacos:8848
          username: ${NACOS_USERNAME}
          password: ${NACOS_PASSWORD}
          namespace: dev
          registry:
            enabled: true
    mcp:
      server:
        type: ASYNC
        sse-endpoint: /sse
        sse-message-endpoint: /mcp
        capabilities:
          tool: true
        annotation-scanner:
          enabled: true
    vectorstore:
      milvus:
        client:
          host: milvus
          port: 19530
        collection-name: yh_rag_collection
        initialize-schema: true
        embedding-dimension: 768
        index-type: IVF_FLAT
        metric-type: L2